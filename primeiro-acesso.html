<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Primeiro acesso — FLUUX</title>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/primeiro-acesso.css">
</head>
<body class="invite-page">
  <main class="invite-shell">
    <section class="invite-card" aria-labelledby="inviteTitle">
      <div class="invite-brand">
        <img src="assets/img/logo.png" alt="FLUUX">
      </div>

      <header class="invite-heading">
        <h1 id="inviteTitle">Defina sua senha</h1>
        <p id="inviteDescription">Crie uma senha para o seu primeiro acesso ao FLUUX.</p>
      </header>

      <form class="invite-form" id="inviteForm" method="post" hidden>
        <label class="invite-field" for="invitePassword">
          <span>Nova senha</span>
          <input class="invite-input" id="invitePassword" type="password"
                 autocomplete="new-password" required>
        </label>

        <label class="invite-field" for="inviteConfirmation">
          <span>Confirme a nova senha</span>
          <input class="invite-input" id="inviteConfirmation" type="password"
                 autocomplete="new-password" required>
        </label>

        <button class="invite-submit" id="inviteSubmit" type="submit">
          Salvar senha
        </button>
      </form>

      <p class="invite-message" id="inviteMessage" role="alert" hidden></p>

      <noscript>
        <p class="invite-message">Ative o JavaScript e abra novamente o link do convite.</p>
      </noscript>

      <footer class="invite-footer">
        <a class="invite-login" href="login.html">
          Ir para o login
          <span aria-hidden="true">→</span>
        </a>
      </footer>
    </section>
  </main>

  <script src="assets/js/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="assets/js/primeiro-acesso.js"></script>
</body>
</html>
