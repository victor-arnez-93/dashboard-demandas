<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesso privado ao FLUUX — Organização de Demandas.">
  <meta name="theme-color" content="#090d10">
  <title>Entrar — FLUUX</title>
  <script>
    document.documentElement.dataset.theme =
      matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  </script>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/login.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <button class="login-theme" id="loginThemeButton" type="button" aria-label="Alternar tema">
        <i class="fa-solid fa-sun"></i>
      </button>

      <div class="login-brand">
        <img src="assets/img/logo.png" alt="FLUUX">
      </div>

      <div class="login-heading">
        <span>AMBIENTE PRIVADO</span>
        <h1 id="loginTitle"><i class="fa-solid fa-lock"></i> Acesso ao painel</h1>
        <p>Entre com suas credenciais para organizar e acompanhar as demandas.</p>
      </div>

      <form id="loginForm" novalidate>
        <label class="login-field">
          <span>E-mail</span>
          <span class="login-input">
            <i class="fa-regular fa-envelope"></i>
            <input id="loginEmail" name="email" type="email" autocomplete="username" placeholder="seu@email.com" required>
          </span>
        </label>

        <div class="login-field">
          <label for="loginPassword">Senha</label>
          <span class="login-input">
            <i class="fa-solid fa-key"></i>
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" required>
            <button id="togglePassword" type="button" aria-label="Mostrar senha"><i class="fa-regular fa-eye"></i></button>
          </span>
        </div>

        <p class="login-message" id="loginMessage" role="alert" hidden></p>

        <button class="login-submit" id="loginSubmit" type="submit">
          <i class="fa-solid fa-right-to-bracket"></i>
          <span>Entrar no sistema</span>
        </button>
      </form>

      <div class="login-security">
        <i class="fa-solid fa-shield-halved"></i>
        <span><strong>Acesso protegido</strong><small>Seus dados permanecem vinculados à conta autenticada.</small></span>
      </div>

      <footer>FLUUX · Organização de Demandas</footer>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/env.js"></script>
  <script type="module" src="assets/js/login.js"></script>
</body>
</html>
